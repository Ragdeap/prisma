spring:
  application:
    name: prisma
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/prisma}
    username: ${DB_USERNAME:prisma}
    password: ${DB_PASSWORD:prisma}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
